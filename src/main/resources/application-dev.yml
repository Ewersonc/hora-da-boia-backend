spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:horadaboia}?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USER:horadaboia}
    password: ${DB_PASSWORD:horadaboia}
  flyway:
    # Inclui os dados de exemplo (mesas) apenas no desenvolvimento
    locations: classpath:db/migration,classpath:db/dev

springdoc:
  swagger-ui:
    enabled: true

app:
  jwt:
    # Chave apenas para desenvolvimento local
    secret: ${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-com-32-bytes}
    expiracao-minutos: 120
  admin:
    # Administrador de desenvolvimento. Em produção defina ADMIN_EMAIL e ADMIN_PASSWORD.
    email: ${ADMIN_EMAIL:admin@horadaboia.local}
    senha: ${ADMIN_PASSWORD:admin12345}
