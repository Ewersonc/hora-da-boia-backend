spring:
  application:
    name: hora-da-boia
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é criado apenas pelo Flyway. Ative 'validate' quando o mapeamento estiver estável.
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo

app:
  cors:
    # Origens do frontend autorizadas a chamar a API (separadas por vírgula)
    origens: ${CORS_ORIGENS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
