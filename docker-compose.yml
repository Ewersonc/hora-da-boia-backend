services:
  db:
    image: mysql:8.4
    container_name: hora-da-boia-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-horadaboia}
      MYSQL_USER: ${DB_USER:-horadaboia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-horadaboia}
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Sobe a aplicação em contêiner: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:mysql://db:3306/${DB_NAME:-horadaboia}?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USER: ${DB_USER:-horadaboia}
      DB_PASSWORD: ${DB_PASSWORD:-horadaboia}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5500}
    ports:
      - "8080:8080"

volumes:
  db_data:
